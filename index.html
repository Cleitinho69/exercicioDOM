<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <button id="mudar">Mudar</button>

    <main>
        <div class="campo_input">
            <label for="txtNome">Nome</label>
            <input class="input" type="text" name="txtNome" id="txtNome">
        </div>
    
        <div class="campo_input">
            <label for="txtIdade">Idade</label>
            <input class="input" type="number" name="txtIdade" id="txtIdade">
        </div>
    
        <div class="campo_input">
            <label for="txtEmail">Email</label>
            <input class="input" type="email" name="txtEmail" id="txtEmail">
        </div>
    
        <div class="campo_input">
            <label for="txtSenha">Senha</label>
            <input class="input" type="number" name="txtSenha" id="txtSenha">
        </div>
    
        <div class="campo_input">
            <label for="txtConfirmar">Confirmar Senha</label>
            <input class="input" type="number" name="txtConfirmar" id="txtConfirmar">
        </div>

        <button id="confirmar">Confirmar</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
